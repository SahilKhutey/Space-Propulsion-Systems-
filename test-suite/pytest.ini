[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    math: Mathematical validation tests
    propulsion: Propulsion system tests
    orbital: Orbital mechanics tests
    mission: Mission simulation tests
    thermal: Thermal analysis tests
    power: Power system tests
    realtime: Real-time simulation tests
    projection: Projection engine tests
    digital_twin: Digital twin tests
    ai: AI optimization tests
    e2e: End-to-end tests
