version: '3.8'

services:
  simulation-service:
    build:
      context: .
      dockerfile: services/simulation_service/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://propsim:propsim@db:5432/propsim
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=propsim
      - POSTGRES_PASSWORD=propsim
      - POSTGRES_DB=propsim
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
