name: Backend CI

on:
  push:
    branches: [main, develop]
    paths: ['core/**', 'engines/**', 'services/**', 'real-time-engine/**', 'test-suite/**']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov ruff mypy
          pip install -e .
      - name: Lint with Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Type check with Mypy
        run: mypy core engines real-time-engine
      - name: Run Unit Tests
        run: pytest core/ engines/ real-time-engine/ -v --cov=core --cov=engines --cov=real_time_engine --cov-report=xml
      - name: Run Physics Validation Tests
        run: pytest test-suite/ -v
